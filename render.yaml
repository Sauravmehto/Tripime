# Render Blueprint — deploy the FastAPI backend.
# Dashboard: New → Blueprint → connect this GitHub repo.
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: tripime-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: python --version && pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: ADMIN_TOKEN_TTL_HOURS
        value: "12"
      - key: CORS_ORIGINS
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_USE_TLS
        value: "true"
